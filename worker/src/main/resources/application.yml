spring:
  application:
    name: cab-service-worker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cabservice}
    username: ${SPRING_DATASOURCE_USERNAME:cabservice}
    password: ${SPRING_DATASOURCE_PASSWORD:cabservice}

  spring:
    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
      properties:
        hibernate:
          format_sql: true
          jdbc:
            time_zone: UTC

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

server:
  port: 8081

cabservice:
  outbox:
    poll-fixed-delay-ms: 1000
    batch-size: 50
